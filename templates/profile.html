<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil — QuizHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .profile-header {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
        }

        .user-details h2 { font-size: 2rem; font-weight: 800; }
        .user-details p { color: var(--text-dim); }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .cat-stat-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .cat-stat-card .icon { font-size: 2.5rem; }
        .cat-stat-info h4 { font-weight: 600; }
        .cat-stat-info p { font-size: 0.85rem; color: var(--text-dim); }

        .history-table {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            border-collapse: collapse;
        }

        .history-table th, .history-table td {
            padding: 1.25rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        .history-table th { background: rgba(0, 0, 0, 0.2); color: var(--text-dim); font-weight: 600; font-size: 0.9rem; }
        .history-table tr:last-child td { border-bottom: none; }

        .score-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .score-high { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .score-mid { background: rgba(234, 179, 8, 0.1); color: #eab308; }
        .score-low { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .history-table tbody tr {
            cursor: pointer;
            transition: background 0.3s;
        }
        .history-table tbody tr:hover {
            background: rgba(255,255,255,0.02);
        }

        /* ─── MODAL ─── */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            background: none; border: none;
            color: var(--text-dim);
            font-size: 1.5rem; cursor: pointer;
        }
        .close-btn:hover { color: var(--text-main); }
        .feedback-item {
            background: var(--glass);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid var(--glass-border);
        }
        .feedback-item.correct { border-color: rgba(34, 197, 94, 0.5); }
        .feedback-item.incorrect { border-color: rgba(239, 68, 68, 0.5); }
        .feedback-q { font-weight: 600; margin-bottom: 0.5rem; }
        .feedback-ans { font-size: 0.9rem; margin-top: 0.25rem; }
        .ans-correct { color: #22c55e; }
        .ans-incorrect { color: #ef4444; }

        /* ─── MOBILE RESPONSIVE ─── */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 1.5rem;
                gap: 1rem;
                border-radius: 18px;
            }

            .avatar {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
            }

            .user-details h2 {
                font-size: 1.5rem;
            }

            .stats-summary {
                grid-template-columns: 1fr;
                gap: 1rem;
                margin-bottom: 2rem;
            }

            .cat-stat-card {
                padding: 1rem;
                border-radius: 16px;
            }

            .cat-stat-card .icon {
                font-size: 2rem;
            }

            /* Table → responsive card layout */
            .history-table {
                border-radius: 18px;
            }

            .history-table thead {
                display: none;
            }

            .history-table tbody tr {
                display: flex;
                flex-wrap: wrap;
                padding: 1rem;
                border-bottom: 1px solid var(--glass-border);
                gap: 0.5rem;
                align-items: center;
            }

            .history-table tbody tr:last-child {
                border-bottom: none;
            }

            .history-table td {
                border-bottom: none;
                padding: 0.25rem 0;
            }

            .history-table td:nth-child(1) {
                width: 100%;
                font-size: 0.75rem;
                color: var(--text-dim);
                order: 1;
            }

            .history-table td:nth-child(2) {
                flex: 1;
                font-weight: 600;
                order: 2;
            }

            .history-table td:nth-child(3) {
                order: 3;
            }

            .history-table td:nth-child(4) {
                order: 4;
                font-size: 0.85rem;
                color: var(--text-dim);
            }

            .history-table td:nth-child(5) {
                order: 5;
                font-size: 0.85rem;
                color: var(--text-dim);
            }
        }

        @media (max-width: 400px) {
            .avatar {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }

            .user-details h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="back-link">← Asosiy sahifa</a>

        <div class="profile-header">
            <div class="avatar" id="user-initial">?</div>
            <div class="user-details">
                <h2 id="username-display">Yuklanmoqda...</h2>
                <p id="email-display">...</p>
                <p id="joined-display" style="font-size: 0.8rem; margin-top: 0.5rem;">Azo bo'lgan sana: ...</p>
            </div>
        </div>

        <h3 style="margin-bottom: 1rem;">Kategoriyalar bo'yicha natijalar</h3>
        <div class="stats-summary" id="cat-stats-container">
            <!-- Stats -->
        </div>

        <h3 style="margin-bottom: 1rem;">Barcha testlar tarixi</h3>
        <table class="history-table">
            <thead>
                <tr>
                    <th>Sana</th>
                    <th>Kategoriya</th>
                    <th>Natija</th>
                    <th>To'g'ri</th>
                    <th>Vaqt</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <!-- History -->
            </tbody>
        </table>
    </div>

    <!-- Natija Tafsilotlari Modali -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 id="modal-title" style="margin-bottom: 0.5rem;">Test Natijasi</h2>
            <p id="modal-score" style="color: var(--text-dim); margin-bottom: 1.5rem;"></p>
            <div id="modal-feedback">
                <!-- Feedback loaded here -->
            </div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            const response = await fetch('/api/profile');
            const data = await response.json();

            if (data.error) { window.location.href = '/'; return; }

            const user = data.user;
            document.getElementById('username-display').textContent = user.username;
            document.getElementById('user-initial').textContent = user.username[0].toUpperCase();
            document.getElementById('email-display').textContent = user.email || 'Email kiritilmagan';
            document.getElementById('joined-display').textContent = `A'zo bo'lgan sana: ${new Date(user.created_at).toLocaleDateString()}`;

            const catContainer = document.getElementById('cat-stats-container');
            catContainer.innerHTML = data.category_stats.map(s => `
                <div class="cat-stat-card">
                    <div class="icon">${s.icon}</div>
                    <div class="cat-stat-info">
                        <h4>${s.name}</h4>
                        <p>${s.attempts} marta topshirilgan</p>
                        <p>Eng yaxshi: <strong>${s.best_score}%</strong></p>
                    </div>
                </div>
            `).join('');

            const historyBody = document.getElementById('history-body');
            if (data.results.length === 0) {
                historyBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-dim);">Hali testlar topshirilmagan</td></tr>';
            } else {
                historyBody.innerHTML = data.results.map(r => {
                    let badgeClass = 'score-low';
                    if (r.percentage >= 80) badgeClass = 'score-high';
                    else if (r.percentage >= 50) badgeClass = 'score-mid';

                    return `
                        <tr onclick="openResultModal(${r.id})">
                            <td>${new Date(r.taken_at).toLocaleDateString()}</td>
                            <td>${r.icon} ${r.category_name}</td>
                            <td><span class="score-badge ${badgeClass}">${r.percentage}%</span></td>
                            <td>${r.score} / ${r.total}</td>
                            <td>${r.time_taken} sek</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        async function openResultModal(resultId) {
            const modal = document.getElementById('resultModal');
            const feedbackContainer = document.getElementById('modal-feedback');
            const title = document.getElementById('modal-title');
            const scoreP = document.getElementById('modal-score');
            
            feedbackContainer.innerHTML = '<p style="text-align:center;">Yuklanmoqda...</p>';
            modal.classList.add('active');

            try {
                const res = await fetch(`/api/results/${resultId}`);
                const data = await res.json();
                
                if (data.error) {
                    feedbackContainer.innerHTML = `<p style="color:#ef4444; text-align:center;">${data.error}</p>`;
                    return;
                }

                title.textContent = `${data.category_name} - Natija`;
                scoreP.innerHTML = `To'g'ri: <strong>${data.score}/${data.total}</strong> (${data.percentage}%)<br>Vaqt: ${data.time_taken} sek`;

                if (!data.feedback || data.feedback.length === 0) {
                    feedbackContainer.innerHTML = '<p style="text-align:center; color: var(--text-dim);">Batafsil ma\'lumot mavjud emas.</p>';
                    return;
                }

                feedbackContainer.innerHTML = data.feedback.map((f, i) => {
                    const isCorr = f.is_correct;
                    const cssClass = isCorr ? 'correct' : 'incorrect';
                    const userAnsText = f.options[f.user_answer] || 'Kiritilmagan';
                    const corrAnsText = f.options[f.correct_answer];
                    
                    return `
                        <div class="feedback-item ${cssClass}">
                            <div class="feedback-q" style="color: ${isCorr ? '#4ade80' : '#f87171'};">${i + 1}. ${f.question}</div>
                            <div class="feedback-ans">
                                Sening javobing: <span class="${isCorr ? 'ans-correct' : 'ans-incorrect'}">${f.user_answer} (${userAnsText})</span>
                            </div>
                            ${!isCorr ? `
                                <div class="feedback-ans" style="margin-top: 4px;">
                                    To'g'ri javob: <span class="ans-correct">${f.correct_answer} (${corrAnsText})</span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

            } catch (err) {
                feedbackContainer.innerHTML = '<p style="color:#ef4444; text-align:center;">Xatolik yuz berdi.</p>';
            }
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('resultModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        loadProfile();
    </script>
</body>
</html>
